<!doctype html>
<html>
  <body>
    <form id="form1">
      <div class="field" id="div1" topic="1" type="1">
        <div class="field-label"><div class="topichtml">姓名：</div></div>
        <input id="q1" value="PRIVATE_NAME" />
      </div>
      <div class="field" id="div2" topic="2" type="3">
        <div class="field-label">
          <span>*</span>
          <div class="topichtml">1、二加二是多少？</div>
        </div>
        <div class="ui-controlgroup">
          <div class="ui-radio">
            <input type="radio" id="q2_1" name="q2" style="display: none" /><a
              class="jqradio"
            ></a>
            <div class="label" for="q2_1">A、4</div>
          </div>
          <div class="ui-radio">
            <input
              type="radio"
              id="q2_2"
              name="q2"
              checked
              style="display: none"
            /><a class="jqradio jqchecked"></a>
            <div class="label" for="q2_2">B、5</div>
          </div>
        </div>
      </div>
      <div class="field" id="div3" topic="3" type="4">
        <div class="field-label"><div class="topichtml">2、选择偶数</div></div>
        <div class="ui-controlgroup">
          <div class="ui-checkbox">
            <input
              type="checkbox"
              id="q3_1"
              name="q3"
              style="display: none"
            /><a class="jqcheck"></a>
            <div class="label" for="q3_1">A、2</div>
          </div>
          <div class="ui-checkbox">
            <input
              type="checkbox"
              id="q3_2"
              name="q3"
              checked
              style="display: none"
            /><a class="jqcheck jqchecked"></a>
            <div class="label" for="q3_2">B、3</div>
          </div>
          <div class="ui-checkbox">
            <input
              type="checkbox"
              id="q3_3"
              name="q3"
              style="display: none"
            /><a class="jqcheck"></a>
            <div class="label" for="q3_3">C、4</div>
          </div>
        </div>
      </div>
      <div class="field" id="div4" topic="4" type="1">
        <div class="field-label">
          <div class="topichtml">3、一加一等于</div>
        </div>
        <input id="q4" />
      </div>
      <div class="field" id="div5" topic="5" type="2">
        <div class="field-label">
          <div class="topichtml">4、说明计算过程。</div>
        </div>
        <textarea></textarea>
      </div>
      <div class="field" id="div6" topic="6" type="3">
        <div class="field-label">
          <div class="topichtml">5、零是偶数吗？</div>
        </div>
        <div class="ui-controlgroup">
          <div class="ui-radio">
            <input type="radio" id="q6_1" name="q6" /><a class="jqradio"></a>
            <div class="label" for="q6_1">是</div>
          </div>
          <div class="ui-radio">
            <input type="radio" id="q6_2" name="q6" /><a class="jqradio"></a>
            <div class="label" for="q6_2">否</div>
          </div>
        </div>
      </div>
      <div class="field" id="div7" topic="7" type="9">
        <div class="field-label"><div class="topichtml">基本信息</div></div>
        <textarea>PRIVATE_NAME</textarea>
      </div>
      <div class="field" id="div8" topic="8" type="3" hidden>
        <div class="field-label"><div class="topichtml">隐藏的题目</div></div>
      </div>
      <div id="ctlNext">提交</div>
    </form>
  </body>
</html>
