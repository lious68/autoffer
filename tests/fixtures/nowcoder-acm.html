<!doctype html>
<html lang="zh-CN">
  <body>
    <!-- Sanitized ACM structure: header/name/example-tag/defaultScore, code-preview-item and pre-wrap samples observed in the authorized live page; text is self-authored. -->
    <header>
      <input value="PRIVATE_CANDIDATE" /><span>PRIVATE_EXAM_HEADER</span>
    </header>
    <div class="question-preview-container">
      <div class="header">
        <div class="name">自编 ACM 练习题</div>
        <span class="defaultScore">100分</span>
      </div>
      <div>
        <span class="ncicon"
          ><svg><path d="M0 0"></path></svg></span
        >时间限制：1秒
      </div>
      <div>空间限制：32MB</div>
      <div>64bit IO Format: %lld</div>
      <div class="rich-text">
        <div>
          <template data-shadow-fixture
            ><style>
              :host {
                color: black;
              }
            </style>
            <p>计算每组两个整数的和。</p>
            <p>请保留每行结果。</p></template
          >
        </div>
      </div>
      <div class="code-preview-item">
        <p class="head"><span class="title">输入描述</span></p>
        <div class="rich-text">
          <div>
            <template data-shadow-fixture
              ><p>第一行是组数，后续每行两个整数。</p>
              <div class="content font14" style="white-space: pre-wrap">
                1 &lt;= n &lt;= 100
              </div>
            </template>
          </div>
        </div>
      </div>
      <div class="code-preview-item">
        <p class="head"><span class="title">输出描述</span></p>
        <p>每组输出一行。</p>
      </div>
      <div class="code-preview-item">
        <p class="head"><span class="title">示例 1</span></p>
        <button>收起</button>
        <div>
          <h4>输入</h4>
          <button>复制</button>
          <div class="content font14" style="white-space: pre-wrap">
            2&#10;1 2&#10;3 4
          </div>
        </div>
        <div>
          <h4>输出</h4>
          <button>复制</button>
          <div class="content font14" style="white-space: pre-wrap">
            3&#10;7
          </div>
        </div>
        <h3>说明</h3>
        <p>各组独立计算。</p>
      </div>
      <div class="code-preview-item">
        <p class="head"><span class="title">示例 2</span></p>
        <div>
          <h4>输入</h4>
          <div class="content font14" style="white-space: pre-wrap">
            1&#10;5 6
          </div>
        </div>
        <div>
          <h4>输出</h4>
          <div class="content font14" style="white-space: pre-wrap">11</div>
        </div>
      </div>
      <div hidden>PRIVATE_HIDDEN</div>
      <div class="monaco-editor">
        <div role="textbox" contenteditable="true">PRIVATE_EDITOR_ANSWER</div>
        <canvas></canvas>
      </div>
      <textarea>PRIVATE_TEXTAREA_ANSWER</textarea>
    </div>
    <button>下一题</button>
  </body>
</html>
