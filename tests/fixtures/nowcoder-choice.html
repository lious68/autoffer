<!doctype html>
<html lang="zh-CN">
  <body>
    <!-- Observed enterprise DOM structure, with self-authored question content. -->
    <header><span>候选人占位</span><input value="PRIVATE_CANDIDATE" /></header>
    <div class="question-preview-container">
      <div class="header">
        <span class="type">单选</span><span class="defaultScore">1分</span>
      </div>
      <div class="scroll">
        <div class="limit"></div>
        <div class="body tw-relative">
          <div class="order-content">
            <div class="tw-text-size-head-pure tw-leading-5 tw-mr-1">1.</div>
            <div class="rich-text old-style">
              <p id="richTextContent_100">
                <template data-shadow-fixture>
                  <style>
                    :host {
                      color: black;
                    }
                  </style>
                  <div id="rich-text-shadow-id_100">
                    <p>通知：活动仅在周六开放。</p>
                    <p>下列哪项说法不符合通知？</p>
                  </div>
                </template>
              </p>
            </div>
          </div>
        </div>
        <div class="answers" theme="light">
          <div class="option-item">
            <span class="option-order">A</span>
            <div class="rich-text old-style option-content">
              <p id="richTextContent_101">
                <template data-shadow-fixture
                  ><div id="rich-text-shadow-id_101">
                    周六可以参加活动。
                  </div></template
                >
              </p>
            </div>
          </div>
          <div class="option-item">
            <span class="option-order">B</span>
            <div class="rich-text old-style option-content">
              <p id="richTextContent_102">
                <template data-shadow-fixture
                  ><div id="rich-text-shadow-id_102">
                    每天都可以参加活动。
                  </div></template
                >
              </p>
            </div>
          </div>
          <div class="option-item">
            <span class="option-order">C</span>
            <div class="rich-text old-style option-content">
              <p id="richTextContent_103">
                <template data-shadow-fixture
                  ><div id="rich-text-shadow-id_103">
                    周日不开放。
                  </div></template
                >
              </p>
            </div>
          </div>
          <div class="option-item">
            <span class="option-order">D</span>
            <div class="rich-text old-style option-content">
              <p id="richTextContent_104">
                <template data-shadow-fixture
                  ><div id="rich-text-shadow-id_104">
                    周一不开放。
                  </div></template
                >
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
    <button>下一题</button>
    <div class="dialog">请返回全屏</div>
  </body>
</html>
